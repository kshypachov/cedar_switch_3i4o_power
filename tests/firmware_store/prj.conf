CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192

# LittleFS on the sim flash, in a 1 MiB partition of its own (boards/*.overlay):
# large enough for the corpus, too small for a 0x1d0000 upload - which is the
# storage_full case.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=8

# SHA-256 through PSA, as on the device (zephyr/tests/crypto/psa).
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_PSA_WANT_ALG_SHA_256=y

CONFIG_FIRMWARE_STORE=y
# Not a multiple of the volume's 4 KiB allocation unit, so rounding the image up
# to whole units is observable (test_storage_full_at_create).
CONFIG_FIRMWARE_STORE_RESERVE_KIB=34
