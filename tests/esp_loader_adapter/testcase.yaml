common:
  # The flashing session over a fake esp-serial-flasher and the real
  # coprocessor-manager on a fake UART: the sim tier of section 12 for
  # esp-loader-adapter (error translation, progress, the order of taking and
  # returning the UART, GPIO cleanup and normal boot on every exit). The
  # ROM protocol itself is the library's and is not tested here; a real write
  # is the hardware tier's (reports/p6).
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  tags:
    - esp_loader_adapter
    - sim
tests:
  cedar.esp_loader_adapter: {}
  cedar.esp_loader_adapter.high_baud:
    extra_configs:
      - CONFIG_ESP_LOADER_ADAPTER_HIGH_BAUD=460800
