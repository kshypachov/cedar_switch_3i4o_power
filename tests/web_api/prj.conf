CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_WEB_API=y

# The HTTP server adapter has its own suite (tests/web_api_http); this one
# drives the core with request values.
CONFIG_WEB_API_HTTP=n
CONFIG_WEB_API_EXTRA_HOSTS="cedar.lan, Switch.local"

CONFIG_WEB_AUTH_PSA_KDF=n
CONFIG_WEB_AUTH_REGISTRY_STORE=n
CONFIG_WEB_AUTH_MAX_SESSIONS=4
CONFIG_WEB_AUTH_IDLE_TIMEOUT_SECONDS=60
CONFIG_WEB_AUTH_ABSOLUTE_TIMEOUT_SECONDS=300
CONFIG_WEB_AUTH_PBKDF2_ITERATIONS=1000
CONFIG_WEB_AUTH_FREE_FAILURES=3
CONFIG_WEB_AUTH_MAX_DELAY_SECONDS=8
CONFIG_WEB_AUTH_GLOBAL_FAILURES=32
CONFIG_WEB_AUTH_GLOBAL_WINDOW_SECONDS=60

# The production value; truncation is reached with more bad fields than this.
CONFIG_API_VALIDATION_MAX_FIELDS=6

# The Matter bindings build against matter-service, driven by a fake platform
# where a test needs one; without it the service reports not_ready.
CONFIG_MATTER_SERVICE=y

# The network bindings over the real network-manager and fake interfaces. The
# firmware's response buffer, because a full scan is 64 access points.
CONFIG_NETWORK_MANAGER=y
CONFIG_WEB_API_RESPONSE_BODY_MAX=16384
# ssid_base64 in and out.
CONFIG_BASE64=y

# The log bindings over the real log-store, with rings and a scan budget small
# enough that a wrap, a byte-bounded page and a budget running out take a few
# dozen records (src/v1_logs.c); the coprocessor bindings over the real
# coprocessor-manager on a fake platform.
CONFIG_LOG_STORE=y
CONFIG_LOG_STORE_STM32_KIB=64
CONFIG_LOG_STORE_ESP32_KIB=4
CONFIG_LOG_STORE_SCAN_BUDGET=32
CONFIG_COPROCESSOR_MANAGER=y

# The firmware upload bindings over the real firmware-store, on LittleFS in a
# 1 MiB sim-flash partition (boards/*.overlay, as tests/firmware_store) - too
# small for a 0x1d0000 image, which is the storage_full case - with SHA-256
# through PSA as on the device.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=8
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_FIRMWARE_STORE=y

# startCoprocessorUpdate over the real coprocessor-updater, on the updater fake
# platform (tests/fakes/fake_update_platform.c) with the staged image read
# through firmware-store (src/v1_firmware.c).
CONFIG_COPROCESSOR_UPDATER=y
