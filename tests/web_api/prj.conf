CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_WEB_API=y

# The HTTP server adapter has its own suite (tests/web_api_http); this one
# drives the core with request values.
CONFIG_WEB_API_HTTP=n
CONFIG_WEB_API_EXTRA_HOSTS="cedar.lan, Switch.local"

CONFIG_WEB_AUTH_PSA_KDF=n
CONFIG_WEB_AUTH_REGISTRY_STORE=n
CONFIG_WEB_AUTH_MAX_SESSIONS=4
CONFIG_WEB_AUTH_IDLE_TIMEOUT_SECONDS=60
CONFIG_WEB_AUTH_ABSOLUTE_TIMEOUT_SECONDS=300
CONFIG_WEB_AUTH_PBKDF2_ITERATIONS=1000
CONFIG_WEB_AUTH_FREE_FAILURES=3
CONFIG_WEB_AUTH_MAX_DELAY_SECONDS=8
CONFIG_WEB_AUTH_GLOBAL_FAILURES=32
CONFIG_WEB_AUTH_GLOBAL_WINDOW_SECONDS=60

# The production value; truncation is reached with more bad fields than this.
CONFIG_API_VALIDATION_MAX_FIELDS=6

# The Matter bindings build against matter-service, driven by a fake platform
# where a test needs one; without it the service reports not_ready.
CONFIG_MATTER_SERVICE=y

# The network bindings over the real network-manager and fake interfaces. The
# firmware's response buffer, because a full scan is 64 access points.
CONFIG_NETWORK_MANAGER=y
CONFIG_WEB_API_RESPONSE_BODY_MAX=16384
# ssid_base64 in and out.
CONFIG_BASE64=y
