CONFIG_ZTEST=y
CONFIG_JOB_MANAGER=y
CONFIG_COPROCESSOR_MANAGER=y
CONFIG_COPROCESSOR_UPDATER=y

# Production timeouts: the clock is the fake's, so the tests cost nothing and
# assert on the numbers the board runs with.
CONFIG_COPROCESSOR_UPDATER_READ_BLOCK=4096
CONFIG_COPROCESSOR_UPDATER_PREFLIGHT_TIMEOUT_MS=5000
CONFIG_COPROCESSOR_UPDATER_CONNECT_TIMEOUT_MS=15000
CONFIG_COPROCESSOR_UPDATER_BEGIN_TIMEOUT_MS=60000
CONFIG_COPROCESSOR_UPDATER_WRITE_TIMEOUT_S=900
CONFIG_COPROCESSOR_UPDATER_VERIFY_TIMEOUT_MS=30000
CONFIG_COPROCESSOR_UPDATER_RECONNECT_TIMEOUT_MS=20000
CONFIG_COPROCESSOR_UPDATER_HEALTH_TIMEOUT_MS=30000
CONFIG_COPROCESSOR_UPDATER_POLL_MS=200
