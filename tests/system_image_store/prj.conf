CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192

# Slot 2 on the sim flash (a 4 MiB partition, 4 KiB erase blocks, erase value
# 0xff) and the metadata on LittleFS in a 1 MiB partition (boards/*.overlay).
# Double writes on: programming a unit that is not erased clears bits instead of
# failing - NOR behaviour, which the resend-after-crash case depends on.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=8

# SHA-256 through PSA, as on the device.
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_PSA_WANT_ALG_SHA_256=y

CONFIG_SYSTEM_IMAGE_STORE=y
# The stream_flash path is built in; each test chooses it through platform.flash_dev.
CONFIG_SYSTEM_IMAGE_STORE_STREAM_FLASH=y
# As in the firmware: the store erases, stream_flash only programs.
CONFIG_STREAM_FLASH_ERASE=n
