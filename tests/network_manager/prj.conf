CONFIG_ZTEST=y
CONFIG_NETWORK_MANAGER=y

# Selected by NETWORK_MANAGER, listed here so the dependency is visible to
# anyone reading the test configuration.
CONFIG_DEVICE_CONFIG_STORE=y
CONFIG_JOB_MANAGER=y
CONFIG_API_VALIDATION=y

CONFIG_LOG=y
CONFIG_NETWORK_MANAGER_LOG_LEVEL=2
CONFIG_DEVICE_CONFIG_STORE_LOG_LEVEL=1

# Production values. The deadlines are driven by an injected clock, so keeping
# the real numbers costs nothing and means the tests assert on the timings the
# contract actually specifies.
CONFIG_NETWORK_MANAGER_CANDIDATE_TTL_SECONDS=300
CONFIG_NETWORK_MANAGER_CONFIRM_TIMEOUT_SECONDS=120
CONFIG_NETWORK_MANAGER_CONFIRM_TIMEOUT_MIN_SECONDS=60
CONFIG_NETWORK_MANAGER_CONFIRM_TIMEOUT_MAX_SECONDS=300
CONFIG_NETWORK_MANAGER_SCAN_MAX_RESULTS=64
