CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_NET_TEST=y
CONFIG_EVENTFD=y
CONFIG_POSIX_API=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4_MAPPING_TO_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_LOOPBACK_MTU=1280
CONFIG_NET_DRIVERS=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_ZVFS_POLL_MAX=16
CONFIG_ZVFS_OPEN_MAX=24
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_TCP_RETRY_COUNT=3
CONFIG_NET_TCP_INIT_RETRANSMISSION_TIMEOUT=120
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_LOG=y

# The server as the firmware configures it (prj.conf of the application),
# except a short inactivity timeout so the stalled-client case takes seconds.
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
CONFIG_HTTP_SERVER_CAPTURE_HEADER_COUNT=8
CONFIG_HTTP_SERVER_CAPTURE_HEADER_BUFFER_SIZE=1024
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=256
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
CONFIG_HTTP_SERVER_COMPLETE_STATUS_PHRASES=y
CONFIG_HTTP_SERVER_STACK_SIZE=8192
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=2
CONFIG_HTTP_SERVER_RESTART_DELAY=10

CONFIG_WEB_API=y
CONFIG_WEB_ASSETS=y
CONFIG_WEB_AUTH_PSA_KDF=n
CONFIG_WEB_AUTH_REGISTRY_STORE=n
CONFIG_WEB_AUTH_PBKDF2_ITERATIONS=1000

CONFIG_MAIN_STACK_SIZE=4096

# The Matter bindings build against matter-service, driven by a fake platform
# where a test needs one; without it the service reports not_ready.
CONFIG_MATTER_SERVICE=y
