CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384

# Deferred, as on the board, but with no processing thread: the test decides
# when messages are processed, so a flood can overflow the buffer on purpose.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_LOG_BUFFER_SIZE=4096
# Without this the core stops reporting drops on a busy system (see the
# module's Kconfig help); the board needs the same setting.
CONFIG_LOG_FAILURE_REPORT_PERIOD=0
# ztest prints with printk; routed through the log it would wait in the buffer.
CONFIG_LOG_PRINTK=n

CONFIG_LOG_STORE=y
CONFIG_ZEPHYR_LOG_SOURCE=y
