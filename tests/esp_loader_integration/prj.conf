# Standalone P0 check: does esp-serial-flasher build for this board and talk to
# the ESP32-C6 over USART3? Deliberately minimal - no networking, no Matter, no
# esp-hosted, so that a failure points at the loader integration and nothing else.

CONFIG_ESP_SERIAL_FLASHER=y
CONFIG_SERIAL_FLASHER_LOG_LEVEL_INFO=y

# Match the board's download-mode sequence from src/plugin_wifi/wifi.c, which
# holds the boot strap 200 ms after releasing reset. Verified on hardware
# 2026-09-12; the library's 50 ms default was not exercised.
CONFIG_SERIAL_FLASHER_RESET_HOLD_TIME_MS=100
CONFIG_SERIAL_FLASHER_BOOT_HOLD_TIME_MS=200

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_CONSOLE_GETCHAR=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=4096

# Boot chain, mirrored from the application's prj.conf. MCUboot already lives in
# internal flash on the board; this image goes into the same external-QSPI slot0
# it boots, so it must be linked and headered the same way.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH_STM32_NOR_MEMMAP=y
CONFIG_XIP=y
CONFIG_ARM_MPU=y
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
CONFIG_MCUBOOT_BOOT_MAX_ALIGN=16
# Flash driver LOG calls run from QSPI-resident code and hard-fault; the
# application disables them for the same reason.
CONFIG_FLASH_LOG_LEVEL_OFF=y

# Keep the console free of shell prompts so the loader trace is readable.
CONFIG_SHELL=n
