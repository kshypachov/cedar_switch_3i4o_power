CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_JOB_MANAGER=y
CONFIG_SYSTEM_UPDATER=y

# Production values: the clock is the fake's, so the tests cost nothing and
# assert on the numbers the board runs with.
CONFIG_SYSTEM_UPDATER_CONFIRM_SECONDS=1200
CONFIG_SYSTEM_UPDATER_REBOOT_DELAY_MS=2000
CONFIG_SYSTEM_UPDATER_CONFIRM_RETRY_MS=10000
CONFIG_SYSTEM_UPDATER_CONFIRM_RETRY_MAX_MS=300000
