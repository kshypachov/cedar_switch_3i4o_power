CONFIG_ZTEST=y
CONFIG_WEB_AUTH=y

# The production adapters need PSA Crypto and settings-registry; this suite
# injects fakes for both, so it builds with nothing but the kernel.
CONFIG_WEB_AUTH_PSA_KDF=n
CONFIG_WEB_AUTH_REGISTRY_STORE=n

# Small pools and short times, so every limit is reachable in a test rather
# than argued about. The production defaults are in lib/Kconfig.
CONFIG_WEB_AUTH_MAX_SESSIONS=2
CONFIG_WEB_AUTH_TOMBSTONES=2
CONFIG_WEB_AUTH_IDLE_TIMEOUT_SECONDS=60
CONFIG_WEB_AUTH_ABSOLUTE_TIMEOUT_SECONDS=300
CONFIG_WEB_AUTH_PBKDF2_ITERATIONS=1000
CONFIG_WEB_AUTH_PBKDF2_MAX_ITERATIONS=5000
CONFIG_WEB_AUTH_PEER_SLOTS=3
CONFIG_WEB_AUTH_FREE_FAILURES=3
CONFIG_WEB_AUTH_MAX_DELAY_SECONDS=8
CONFIG_WEB_AUTH_GLOBAL_FAILURES=16
CONFIG_WEB_AUTH_GLOBAL_WINDOW_SECONDS=60
