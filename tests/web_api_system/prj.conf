CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=32768
CONFIG_WEB_API=y

# The request values go through the core; the HTTP adapter has its own suite.
CONFIG_WEB_API_HTTP=n
CONFIG_WEB_API_EXTRA_HOSTS="cedar.lan, Switch.local"

CONFIG_WEB_AUTH_PSA_KDF=n
CONFIG_WEB_AUTH_REGISTRY_STORE=n
CONFIG_WEB_AUTH_MAX_SESSIONS=4
CONFIG_WEB_AUTH_IDLE_TIMEOUT_SECONDS=60
CONFIG_WEB_AUTH_ABSOLUTE_TIMEOUT_SECONDS=300
CONFIG_WEB_AUTH_PBKDF2_ITERATIONS=1000
CONFIG_WEB_AUTH_FREE_FAILURES=3
CONFIG_WEB_AUTH_MAX_DELAY_SECONDS=8
CONFIG_WEB_AUTH_GLOBAL_FAILURES=32
CONFIG_WEB_AUTH_GLOBAL_WINDOW_SECONDS=60

CONFIG_API_VALIDATION_MAX_FIELDS=6

# Every binding of the route table links; the ones these tests do not drive run
# over the same fakes as tests/web_api (capabilities reads them).
CONFIG_MATTER_SERVICE=y
CONFIG_NETWORK_MANAGER=y
CONFIG_WEB_API_RESPONSE_BODY_MAX=16384
CONFIG_BASE64=y
CONFIG_LOG_STORE=y
CONFIG_LOG_STORE_STM32_KIB=64
CONFIG_LOG_STORE_ESP32_KIB=4
CONFIG_COPROCESSOR_MANAGER=y
CONFIG_COPROCESSOR_UPDATER=y

# Both stores' metadata on LittleFS in a 1 MiB partition, as /lfs/firmware on the
# board; slot 2 on a 4 MiB partition of the sim flash (boards/*.overlay). Double
# writes on: NOR behaviour, as tests/system_image_store.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=8
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_FIRMWARE_STORE=y

# The STM32 update: the slot store and the updater, the updater over the fake
# board (tests/fakes/fake_system_platform) with its upload calls on the real store.
CONFIG_SYSTEM_IMAGE_STORE=y
CONFIG_SYSTEM_UPDATER=y
CONFIG_SYSTEM_UPDATER_CONFIRM_SECONDS=1200
