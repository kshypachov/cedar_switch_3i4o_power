# PSRAM на OCTOSPI2 поднимает MCUboot (sysbuild/mcuboot.conf: qspi-psram driver,
# zephyr PR #104100) и оставляет его в memory-mapped режиме на 0x70000000.
# В XIP-приложении драйверов OCTOSPI/MSPI быть не должно: их init вызывает
# HAL_OSPIM_Config(), который выключает OCTOSPI1, с которой исполняется код.
#CONFIG_MEMC=y
#CONFIG_MSPI=y
# Данные, стеки и кучи сетевого стека, fs, Matter, crypto, логов, приложения
# линкуются в PSRAM (CMakeLists.txt, блок PSRAM; src/helpers/psram_sections.ld).
