# Zephyr 4.4+ (TF-PSA-Crypto): legacy-символы MBEDTLS_ECP_C / ECDH_C / ECDSA_C /
# CIPHER_*_ENABLED / HKDF_C / RSA_C / PKCS1_V15 / USE_PSA_CRYPTO удалены —
