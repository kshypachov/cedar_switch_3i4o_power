CONFIG_TFM_BL2=n

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=1024

# Job manager: identity, lifecycle and idempotency for operations that cannot
# finish inside an HTTP handler. Enabled ahead of its first consumer so the
# module is compiled by the firmware build, not only by the sim tests.
CONFIG_JOB_MANAGER=y

# Device configuration store: committed and pending generations of the network
# configuration, plus the secrets that go with it. Enabled ahead of its first
# consumer so the firmware build compiles it and its BUILD_ASSERTs on the
# persisted layout are checked for this target, not only for native_sim.
CONFIG_DEVICE_CONFIG_STORE=y

# API validation: the contract's error table as code, plus the strict parsers
# the route handlers need. Enabled ahead of its first consumer so the firmware
# build compiles it, not only the sim tests.
CONFIG_API_VALIDATION=y

# Network manager: the transaction that changes the network without being able
# to lose it. Selects the three modules above. Enabled ahead of its first
# consumer so the firmware build compiles it, not only the sim tests.
CONFIG_NETWORK_MANAGER=y

# P5, logs and the owner of the C6's UART: two rings in PSRAM (256 KiB each by
# default), the Zephyr log backend into them, the C6's UART lines, and the
# manager that hands USART3 to the console, the USB bridge or the flasher.
CONFIG_LOG_STORE=y
CONFIG_ZEPHYR_LOG_SOURCE=y
CONFIG_ESP32_LOG_SOURCE=y
CONFIG_COPROCESSOR_MANAGER=y
# Works around the log core (log_core.c, z_impl_log_process()): it advances the
# next failure report by one period for every processed message, so after N
# messages dropped() reaches backends only past N periods of uptime - with the
# default 1000 ms, practically never. 0 reports losses on every pass, which is
# what zephyr-log-source counts (reports/p5, notes-log-sources.md).
CONFIG_LOG_FAILURE_REPORT_PERIOD=0

# The HTTP server sends from its one thread on blocking sockets; web-api's
# adapter sets SO_SNDTIMEO so a client that stops reading mid-export cannot
# hold that thread (CONFIG_WEB_API_HTTP_SEND_TIMEOUT_MS, reports/p5).
CONFIG_NET_CONTEXT_SNDTIMEO=y

# P6, the ESP32-C6 UART updater: esp-serial-flasher on the esp_loader0 node of
# the app overlay. Strap timing as proven on both boards (reports/p0,
# tests/esp_loader_integration): BOOT held 200 ms after EN is released; the
# library's 50 ms default was never exercised.
CONFIG_ESP_SERIAL_FLASHER=y
# The library's Zephyr port reads and writes USART3 through tty_serial, and
# subsys/console builds tty.c only with CONSOLE_GETCHAR (the library selects
# CONSOLE_SUBSYS alone, which links nothing). Nothing here calls
# console_getchar(); the shell keeps USART1.
CONFIG_CONSOLE_GETCHAR=y
# The library's tty rings. A FLASH_DATA frame (1024 bytes, header, SLIP escapes up to
# twice the size) does not fit the default 512-byte transmit ring, and tty_write()
# then feeds it byte by byte - a wake-up of the installing worker (priority 10) per
# byte sent, which starved the log thread for 20 s during the first install that
# reached `writing` (hw/logs/11). 4096 holds a whole escaped frame.
CONFIG_ESP_SERIAL_FLASHER_UART_BUFSIZE=4096
CONFIG_SERIAL_FLASHER_RESET_HOLD_TIME_MS=100
CONFIG_SERIAL_FLASHER_BOOT_HOLD_TIME_MS=200
# The uploaded merged file in /lfs/firmware: chunks written and synced one at a
# time, recovered after a reboot, checked before an install (SHA-256 through PSA,
# already enabled above for web-auth).
CONFIG_FIRMWARE_STORE=y
# The install: esp-loader-adapter's session over the esp_loader0 node (never
# initialised by the kernel, see the overlay) and coprocessor-updater's job,
# journal and health check (reports/p6).
CONFIG_ESP_LOADER_ADAPTER=y
CONFIG_ESP_LOADER_ADAPTER_ZEPHYR=y
CONFIG_COPROCESSOR_UPDATER=y
CONFIG_ESP_LOADER_ADAPTER_UPDATER_OPS=y
# Both phases open files on /lfs, which board B's settings file backend and Matter's
# init keep busy for the first minutes after a boot: an install started 55 s after
# boot failed "preflight took longer than 5000 ms" (reports/p6, hw/logs/10).
CONFIG_COPROCESSOR_UPDATER_PREFLIGHT_TIMEOUT_MS=30000
CONFIG_COPROCESSOR_UPDATER_CONNECT_TIMEOUT_MS=30000
