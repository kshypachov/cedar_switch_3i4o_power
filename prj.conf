# Web interface (P2). Values below were chosen against measurements of this
# tree's server (docs/device-development/reports/p2):
# - the API reads eight request headers, and a captured value longer than
#   MAX_HEADER_LEN is dropped silently: a session cookie alone is 57 bytes;
# - API routes with path parameters need wildcard resources;
# - status lines without a reason phrase lack the space RFC 9112 requires;
# - the server thread runs the handlers, including the password derivation.
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
# Nine: Content-Type joined the eight in P6 - the HTTP/1 parser does not keep it.
CONFIG_HTTP_SERVER_CAPTURE_HEADER_COUNT=9
CONFIG_HTTP_SERVER_CAPTURE_HEADER_BUFFER_SIZE=1024
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=256
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
CONFIG_HTTP_SERVER_COMPLETE_STATUS_PHRASES=y
CONFIG_HTTP_SERVER_STACK_SIZE=6144
CONFIG_WEB_API=y
CONFIG_WEB_ASSETS=y
# Matter state, commissioning window, codes and fabrics for the web API (P3).
CONFIG_MATTER_SERVICE=y
# The password derivation should not wait behind the Matter thread: both ran at
# preemptive priority 14 without time slicing. One level above Matter it can
# preempt it. On the board (P3) sign-ins still sometimes exceeded 10 s while
# Matter was busy with storage, so the stall has another cause, still open.
CONFIG_WEB_AUTH_KDF_THREAD_PRIORITY=13
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
# Network API (P4). A scan of 64 access points is about 11 KiB of JSON, so a
# response is built in 16 KiB (four clients, in PSRAM with libweb_api.a);
# ssid_base64 needs the base64 codec.
CONFIG_WEB_API_RESPONSE_BODY_MAX=16384
CONFIG_BASE64=y
