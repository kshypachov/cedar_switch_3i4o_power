# Modelled on st,stm32wba-pka.yaml from zephyrproject-rtos/zephyr#116564 (open,
# STM32WBA only). Replace with the upstream binding once one covers STM32U5.

description: STM32 Public Key Accelerator (PKA)

compatible: "st,stm32-pka"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
    description: |
      PKA clock. On STM32U5 the PKA also needs the RNG clock running while it is
      enabled; the driver takes it from the rng node.
