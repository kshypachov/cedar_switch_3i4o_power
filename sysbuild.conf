# Sysbuild: MCUboot во внутренней flash + приложение во внешней QSPI (ext_flash_app).
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# slot0 — внешняя QSPI (4 МБ), slot1 и scratch — SPI NOR (см. ext_flash_app.dts).
# Тот же режим, что был в рабочем загрузчике cedar_switch_3i4o_power_bootloader.
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y

# Без подписи (только hash TLV), как в прежнем загрузчике: совместимо с уже
# опубликованными OTA-образами zephyr.signed.bin.
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
