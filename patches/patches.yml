# Patches this application carries against repositories it does not own.
#
# Format and tooling: `west patch`, schema at
# zephyr/scripts/schemas/patch-schema.yml. The command has to be told where the
# definitions live, because -sm resolves a directory and not a west project
# name — this application carries no zephyr/module.yml of its own, so its west
# name "cedar_switch_3i4o_power" is rejected and the workspace-relative
# directory is used instead:
#
#   west patch -sm cedar_switch_3in4out_power -b patches -l patches/patches.yml list
#   west patch -sm cedar_switch_3in4out_power -b patches -l patches/patches.yml -dm zephyr apply
#
# Do NOT run `west patch clean` in this workspace. Its default clean-command is
# `git clean -d -f -x`, and the zephyr checkout here is shared with several
# other projects whose work is untracked — including the submanifest this
# product needs. See README.md.

patches:
  - path: zephyr/eth_w5500-block-ipv4-multicast-in-macraw-mode.patch
    sha256sum: 131ac3912ebf86b50e490630851866f4b3a93bba9c67d1f872884c3d885e56cb
    module: zephyr
    author: Кирило Шипачов
    email: kshypachov@gmail.com
    date: 2026-09-12
    upstreamable: true
    issue: https://github.com/zephyrproject-rtos/zephyr/issues/115626
    merge-status: false
    comments: >-
      Sets MMB (Sn_MR bit 5) so the W5500 drops IPv4 multicast in hardware.
      Removes the traffic that starved the cooperative RX thread on this
      product; it is not a fix for the thread priority itself. MIP6B is
      deliberately left clear because Matter needs IPv6 multicast. Both bits
      were characterised on the board, not taken from the datasheet. Upstream
      request drafted in docs/upstream/w5500-multicast-filtering-request.md.

  - path: tf-psa-crypto/ecp-p256-stm32-pka.patch
    sha256sum: a604ff1f59b30a090cfbd58765f553bd91892f769303529ec34292a77974962a
    module: tf-psa-crypto
    author: Кирило Шипачов
    email: kshypachov@gmail.com
    date: 2026-09-15
    upstreamable: false
    merge-status: false
    comments: >-
      Offloads P-256 mbedtls_ecp_mul() and mbedtls_ecp_muladd() in the builtin
      ECP module to the STM32U585 PKA (ECCMul, ECCDoubleBaseLadder) through
      modules/psa-driver-stm32. Matter's SPAKE2+ (PASE) calls these directly,
      past the PSA driver interface, so the PSA driver alone does not reach it.
      Everything added is under #if defined(CONFIG_STM32_PKA_ECP_P256), a
      Kconfig symbol only this application defines, so other projects building
      from the shared tf-psa-crypto checkout compile the file unchanged. Not
      offloaded (other curves, restartable contexts, non-affine points, scalars
      outside [1, N-1], any PKA error) falls through to the software path.
      Applied to the tree on 2026-09-15 with git apply (tf-psa-crypto 000d24cb5).
      Measurements and the change log: docs/device-development/reports/crypto/pka.

  - path: zephyr/eth_w5500-reopen-socket-on-inconsistent-rx.patch
    sha256sum: 1de08f1de330cbdaba6e5792dacf166aed8c39760e5c298962f1e8e57b227d08
    module: zephyr
    author: Кирило Шипачов
    email: kshypachov@gmail.com
    date: 2026-09-13
    upstreamable: false
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/115626
    merge-status: false
    comments: >-
      Closes and reopens socket 0 when the receive length header is 2 or
      less, larger than the bytes buffered (Sn_RX_RSR) or than
      NET_ETH_MAX_FRAME_SIZE, instead of copying past the last fragment of the
      packet and halting on a bus fault (board B, every boot) or leaving
      Sn_RX_RD in place. Replaces the first version of this entry
      (eth_w5500-drop-frames-longer-than-buffered.patch, sha256 a133effd…),
      which advanced Sn_RX_RD by Sn_RX_RSR: read as 65535 in that state, it
      left board B receiving nothing until reset
      (docs/device-development/reports/p4/hw). Not sent upstream on its own:
      PR #115626 rewrites w5500_rx() with a comparison against Sn_RX_RSR, and
      this entry goes when that PR is merged. Applied to the shared zephyr
      checkout on 2026-09-13 with the owner's permission, on its own: the
      multicast entry above was already applied, and `west patch apply` stops
      at the first patch that does not.

  - path: zephyr/esp_hosted_mcu-restart-after-coprocessor-flash.patch
    sha256sum: c978d1e7089831cb4ec21e62ffe37d517f01ab6b7fe0f19e1200ee2d3d596449
    module: zephyr
    author: Кирило Шипачов
    email: kshypachov@gmail.com
    date: 2026-09-14
    upstreamable: true
    merge-status: false
    comments: >-
      Adds esp_hosted_mcu_restart() and esp_hosted_mcu_wifi_restart(), called
      by the coprocessor updater after it re-flashed the ESP32-C6 over UART and
      released it from reset (owner decision P6 №2 (a)). The core forgets the
      learned firmware version, a pending RPC, the frame stride and receive
      data of the previous run and waits for the new version; the Wi-Fi driver
      reports the old association lost and runs WifiInit/SetWifiMode/WifiStart
      again. Neither pulses EN, and nothing changes unless they are called. A
      Wi-Fi device whose init failed at boot stays not ready (-ENODEV): its
      interface comes up only after a host reboot. Made against the driver as
      it stands in this checkout, which already carries uncommitted edits to
      the same files from other work; on a clean upstream tree it may not
      apply. Applied to the shared zephyr checkout on 2026-09-14 10:07 +0300,
      on its own, after git apply --check; builds, no behaviour change unless
      called; not exercised on hardware at that time
      (docs/device-development/reports/p6/notes-hosted-restart-patch.md).

  - path: zephyr/esp_hosted_mcu-suspend-while-coprocessor-flashes.patch
    sha256sum: 366d058898126ea730f738eb1a0b6770ac2ce64b01536a738fd89e32d81f6398
    module: zephyr
    author: Кирило Шипачов
    email: kshypachov@gmail.com
    date: 2026-09-14
    upstreamable: true
    merge-status: false
    comments: >-
      Two changes to the receive thread, found on board B during the first
      coprocessor installs (docs/device-development/reports/p6/hw, logs 09):
      with the ESP32-C6 in its UART ROM loader the data-ready line stays high
      with no frames, and the thread polled SPI2 - shared with the W5500 -
      without pause, starving the CPU, the Ethernet and the updater (two J-Link
      halts inside spi_stm32 under esp_hosted_mcu_event_task). Adds
      esp_hosted_mcu_suspend(): while suspended the thread only sleeps its poll
      interval and esp_hosted_mcu_send_frame() returns -EAGAIN. And, with or
      without suspension, a burst in which data-ready was high but no transfer
      carried a frame ends in a sleep of the poll interval instead of an
      immediate retry (k_yield() gives nothing to lower priorities). Depends on
      the restart entry above (rx_flush); made against this checkout's driver.
      Applied to the shared zephyr checkout on 2026-09-14 ~13:40 +0300 after a
      reverse git apply --check against the tree and an application build; the
      owner allowed driver patches to be applied after verification (P6 №2).

  - path: zephyr/flash_stm32_ospi-xip-safe-program-erase.patch
    sha256sum: 57dba3e1b09255a65ec6fbdb4bcd354eb5a1b0915e03cd8d49a30f185c292dc1
    module: zephyr
    author: Кирило Шипачов
    email: kshypachov@gmail.com
    date: 2026-09-06
    upstreamable: true
    merge-status: false
    comments: >-
      FLASH_STM32_OSPI_XIP: program and erase the OCTOSPI NOR while the firmware
      executes from it (ESP-IDF spi_flash guard model). Each page or sector runs
      from .ramfunc with interrupts masked and the controller briefly out of
      memory-mapped mode, restoring the configuration MCUboot left; SysTick
      wraps counted meanwhile are reported through the new
      sys_clock_systick_wraps_observed() in cortex_m_systick.c. Written by the
      owner on 2026-09-06 and present in the shared zephyr checkout since then
      (flash_stm32_ospi_xip.{c,h} staged, the other files modified); not
      recorded until the STM32 web update needed it to write image_ok into
      slot 1 (owner's decision 2026-09-15, reports/stm32-update). Recorded on
      2026-09-15 from `git diff HEAD` of these seven paths at zephyr b6a5e6e8aa9;
      a reverse git apply --check against the tree passes, and the tree was not
      changed. Nothing changes unless an application sets
      CONFIG_FLASH_STM32_OSPI_XIP. The same checkout carries separate,
      unrelated edits to drivers/timer/esp32_sys_timer.c and Kconfig.esp32 that
      are not part of this entry.

  - path: zephyr/http_server-release-fallback-resource-on-client-close.patch
    sha256sum: daa91ff03b9d1bbeb7f951732745fb2911e8a8837dcfb01d10d0c41feed9e70c
    module: zephyr
    author: Кирило Шипачов
    email: kshypachov@gmail.com
    date: 2026-09-18
    upstreamable: true
    merge-status: false
    comments: >-
      client_release_resources() walks only the service's resource list, so a
      dynamic fallback resource (res_fallback, Zephyr ea6ca4e8b74, v4.1.0) stays
      held by a freed client when a transaction on it is aborted. The web
      application is served through the fallback (src/web/web_server.c), so one
      aborted transaction answered every page and asset with 409 Conflict until
      reboot (board at 192.168.88.10 on 2026-09-18; holder read with devmem
      pointed at server_ctx.clients[3] while all four slots were free,
      docs/device-development/reports/web-fallback-409). The patch releases the
      fallback of each service too and adds a test to
      tests/net/lib/http_server/core: it fails without the change, and with it
      the suite passes 73 of 73 on native_sim/native/64 in the tests/ci
      container, as does cedar.web_api_http (22 of 22). Not fixed upstream as
      of 2026-09-18 (main b5f5f9ad2e9); no issue or PR found. Made against
      zephyr b6a5e6e8aa9, where both files were unmodified. Round-trip on
      2026-09-18: reverted, applied alone with `west patch apply` through a
      one-entry list, diff identical to the tested one, then reverted again -
      the shared checkout does not carry it until the owner decides.
