# MCUboot для cedar_switch_3in4out_power_rev3 (ext_flash_app).
# Перенесено из cedar_switch_3i4o_power_bootloader/prj.conf; режим swap и тип
# подписи задаются в sysbuild.conf.

CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240

# Внешняя QSPI (slot0) в memory-mapped режиме; было CONFIG_STM32_MEMMAP
CONFIG_FLASH=y
CONFIG_FLASH_STM32_NOR_MEMMAP=y
CONFIG_ARM_MPU=y
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_MEM_ATTR=y

# slot1 и scratch на SPI NOR
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# PSRAM на OCTOSPI2 (qspi-psram, chip-variant AUTO) поднимается здесь и остаётся
# в memory-mapped режиме на 0x70000000 для XIP-приложения, в котором драйверов
# OCTOSPI нет. Порядок init: flash (50) -> MSPI (70) -> MEMC (80), всё из
# внутренней flash, поэтому HAL_OSPIM_Config() тут безопасен.
CONFIG_MEMC=y
CONFIG_MSPI=y
CONFIG_MSPI_MEMMAP=y
CONFIG_MEMC_LOG_LEVEL_INF=y

# 4 МБ слоты по 4 КБ секторам
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=1024

# boot_go_hook (sysbuild/mcuboot_hooks): ICACHE remap + подтверждение через BBRAM
CONFIG_BOOT_GO_HOOKS=y
# Не выключать кэши перед прыжком (default y): выключенный ICACHE снимает remap
# 0x02000000 -> 0x90000000, и do_boot ловит bus fault на чтении vt->msp
# (arch/arm.c), приложение по алиасу недоступно.
CONFIG_BOOT_DISABLE_CACHES=n
CONFIG_BBRAM=y
CONFIG_BBRAM_INIT_PRIORITY=60
CONFIG_RTC=y
CONFIG_RTC_STM32=y

CONFIG_FAULT_DUMP=2

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_NANO=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
