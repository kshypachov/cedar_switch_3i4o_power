# File backend as the firmware shipped it until 2026-09-14: /lfs/settings, MAX_LINES 128.
# This file used to be empty (prj.conf was File); since the switch to ZMS it must set the
# backend itself, or File trials would silently build ZMS.
CONFIG_SETTINGS_ZMS=n
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings"
CONFIG_SETTINGS_FILE_MAX_LINES=128
