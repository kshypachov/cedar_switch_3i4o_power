# p256-m for PSA secp256r1 (ECDSA, ECDH, keygen). It drops the builtin ECP module, but
# Matter's SPAKE2+ (CHIPCryptoPALPSA.cpp) calls mbedtls_ecp_mul/muladd directly; EC J-PAKE
# is not accelerated by p256-m, so wanting it keeps builtin ECP + the secp256r1 curve.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=y
CONFIG_PSA_WANT_ALG_JPAKE=y
