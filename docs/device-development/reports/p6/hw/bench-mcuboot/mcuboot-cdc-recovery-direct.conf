# Step 0 of the STM32 web update (reports/p6/stm32-ota-proposal.md), bench only, applied after
# mcuboot-cdc-recovery-fast.conf: recovery may write the secondary slot. mcumgr's image number then
# names a slot (boot_serial.c: image_index * 2 + slot + 1): 1 = slot0_partition, 2 = slot1_partition.
# With BOOT_SERIAL_IMG_GRP_IMAGE_STATE (already on) `image test <hash>` marks slot 2 pending, and the
# next boot swaps it in through scratch_partition.
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y
