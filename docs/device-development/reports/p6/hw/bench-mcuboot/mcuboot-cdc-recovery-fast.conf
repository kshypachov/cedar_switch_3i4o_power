# Bench-only MCUboot for board B: log on the UART console, image upload over USB CDC ACM.
# Copy of reports/board-b/bench-mcuboot/mcuboot-cdc-recovery.conf (main tree, 2026-09-13) with
# larger SMP frames (owner's permission to reflash MCUboot, 2026-09-14): the old build took the
# default 1024-byte frame and mcumgr ran at mtu=512, ~2.5 thousand request/response round trips per
# MiB at ~3.7 KiB/s. The baud rate of a CDC ACM port does nothing.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y
CONFIG_USB_DEVICE_SN="CEDAR-B-RECOVERY"
CONFIG_USB_DEVICE_PRODUCT="Cedar MCUboot recovery"
# Decoded SMP frame up to 8 KiB (mcumgr mtu=4096 leaves room for the header and CBOR).
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=8192
# A 4 KiB frame arrives as ~43 base64 lines of 128 bytes; 8 queued line buffers could drop lines
# while the main loop writes flash.
CONFIG_BOOT_LINE_BUFS=64
